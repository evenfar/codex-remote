<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Codex Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======== 配对页 ======== -->
<div id="page-pair" class="page">
  <div class="pair-box">
    <div class="pair-icon">🔗</div>
    <h1>Codex Remote</h1>
    <p class="pair-sub">输入电脑上显示的配对码</p>
    <input id="pair-input" type="text" inputmode="numeric" autocomplete="off"
           placeholder="6 位配对码" maxlength="43">
    <button id="pair-btn" class="btn-primary">连接</button>
    <p id="pair-error" class="pair-error"></p>
  </div>
</div>

<!-- ======== 主视图（会话列表 + 机器） ======== -->
<div id="page-threads" class="page hidden">
  <header class="topbar">
    <div class="topbar-title">会话</div>
    <button id="btn-machines" class="btn-icon" title="机器管理">🖥</button>
    <button id="btn-new-thread" class="btn-icon" title="新会话">＋</button>
  </header>

  <!-- 搜索框 -->
  <div class="search-bar">
    <input id="search-input" type="search" placeholder="搜索会话标题或摘要…" autocomplete="off">
  </div>

  <!-- 机器切换条 -->
  <div id="machine-bar" class="machine-bar"></div>

  <!-- 当前机器状态行 -->
  <div id="machine-status" class="machine-status"></div>

  <div id="thread-list" class="thread-list"></div>
</div>

<!-- ======== 机器管理页 ======== -->
<div id="page-machines" class="page hidden">
  <header class="topbar">
    <button id="btn-machines-back" class="btn-icon" title="返回">‹</button>
    <div class="topbar-title">机器管理</div>
    <button id="btn-add-machine" class="btn-icon" title="添加服务器">＋</button>
  </header>
  <div id="machine-list" class="machine-list"></div>

  <!-- 服务器表单（添加/编辑） -->
  <div id="machine-form" class="machine-form hidden">
    <h3 id="machine-form-title">添加服务器（SSH）</h3>
    <label>名称<input id="mf-name" placeholder="我的服务器"></label>
    <label>主机<input id="mf-host" placeholder="server.example.com"></label>
    <label>端口<input id="mf-port" type="number" value="22"></label>
    <label>用户名<input id="mf-user" placeholder="devuser"></label>
    <label>SSH 私钥路径（可选，默认 ~/.ssh/id_rsa）<input id="mf-key" placeholder="%USERPROFILE%\.ssh\id_rsa"></label>
    <label>工作目录（可选）<input id="mf-workspace" placeholder="/home/devuser/projects"></label>
    <label>Codex 路径（可选）<input id="mf-codex-bin" placeholder="默认优先当前用户 ~/.local/bin/codex"></label>
    <div class="form-actions">
      <button id="mf-save" class="btn-primary">保存并连接</button>
      <button id="mf-cancel" class="btn-ghost">取消</button>
    </div>
    <p class="form-note">要求：服务器已装 codex 并完成登录；本机可免密 SSH（公钥认证）。</p>
  </div>
</div>

<!-- ======== 对话页 ======== -->
<div id="page-chat" class="page hidden">
  <header class="topbar">
    <button id="btn-back" class="btn-icon" title="返回">‹</button>
    <div id="chat-title" class="topbar-title">新会话</div>
    <div id="chat-badges" class="chat-badges"></div>
    <button id="btn-chat-settings" class="btn-icon" title="设置">⚙</button>
  </header>

  <!-- 设置抽屉 -->
  <div id="settings-drawer" class="settings-drawer hidden">
    <div class="drawer-section">
      <div class="drawer-label">模型</div>
      <div id="model-options" class="option-grid"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">推理强度</div>
      <div id="effort-options" class="option-grid"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">沙箱模式</div>
      <div id="sandbox-options" class="option-grid"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">上下文</div>
      <div class="drawer-row">
        <button id="btn-compact" class="btn-ghost">压缩上下文</button>
        <button id="btn-rename" class="btn-ghost">重命名会话</button>
      </div>
    </div>
    <div id="usage-panel" class="usage-panel"></div>
  </div>

  <div id="chat-messages" class="chat-messages"></div>
  <div id="approval-bar" class="approval-bar hidden">
    <div id="approval-text" class="approval-text"></div>
    <div class="approval-actions">
      <button id="btn-approve" class="btn-danger">允许</button>
      <button id="btn-decline" class="btn-ghost">拒绝</button>
    </div>
  </div>
  <div id="queue-bar" class="queue-bar hidden">
    <span id="queue-count"></span>
    <button id="queue-toggle" class="link-btn">查看队列</button>
  </div>
  <div id="queue-panel" class="queue-panel hidden"></div>
  <div id="image-tray" class="image-tray hidden"></div>
  <div class="input-bar">
    <input id="image-input" class="hidden" type="file" accept="image/*" multiple>
    <button id="btn-attach" class="btn-attach" title="添加图片">＋</button>
    <textarea id="msg-input" rows="1" placeholder="给 Codex 发消息…"></textarea>
    <button id="btn-send" class="btn-send">➤</button>
    <button id="btn-queue" class="btn-queue hidden" title="加入任务队列">≡</button>
    <button id="btn-steer" class="btn-steer hidden" title="插话（不打断当前任务）">💬</button>
    <button id="btn-stop" class="btn-stop hidden">■</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
